# golangci-lint configuration
run:
  timeout: 10m
  issues-exit-code: 1
  tests: true

output:
  formats: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  govet:
    enable-all: true

  gocyclo:
    min-complexity: 15

  gofmt:
    simplify: true

  goimports:
    local-prefixes: github.com/rkuprov/nyumspace

  golint:
    min-confidence: 0.8

  goconst:
    min-len: 3
    min-occurrences: 3

  misspell:
    locale: US

  lll:
    line-length: 140

  unparam:
    check-exported: false

  nakedret:
    max-func-lines: 30

  prealloc:
    simple: true
    range-loops: true
    for-loops: false

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gocyclo
    - gofmt
    - goimports
    - goconst
    - misspell
    - lll
    - unparam
    - nakedret
    - prealloc
    - noctx
    - rowserrcheck
    - sqlclosecheck

  disable:

issues:
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec

  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*_generated\\.go$"
    # Exclude lll issues for long lines with go:generate
  skip-dirs:
    - vendor
    - bin
    - migrations
    - linters:
        - lll
      source: "^//go:generate "

    # Exclude specific issues in daemon.go if needed
    - path: pkg/daemon/daemon\.go
      text: "G104: Errors unhandled"
      linters:
        - gosec

  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

severity:
  default-severity: error
  rules:
    - linters:
        - misspell
      severity: warning