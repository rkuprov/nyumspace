syntax = "proto3";
package nyum;

// UserRegistration messages
message UserRegistrationRequest {
  string username = 1;
  string password = 2;
  string email = 3;
}

message UserRegistrationResponse {
  string message = 1;
  string user_id = 2;
  string error = 3;
}

// GetUser messages
message UserRequest {
  string user_id = 1;
}

message UserResponse {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string created_at = 4;
  string updated_at = 5;
}

// UpdateUser messages
message UserUpdateRequest {
  optional string username = 1;
  optional string email = 2;
  optional string password = 3;
}

message UserUpdateResponse {
  string message = 1;
  string error = 2;
}

// DeleteUser messages
message UserDeleteRequest {
  string user_id = 1;
}

message UserDeleteResponse {
  string user_id = 1;
  string message = 2;
  string error = 3;
}

// Login messages
message UserLoginRequest {
  string email = 1;
  string password = 2;
}

message UserLoginResponse {
  string session_token = 1;
  string message = 3;
  string user_id = 4;
  string error = 5;
}

// Logout messages
message UserLogoutRequest {
  string session_token = 1;
}

message UserLogoutResponse {
  string message = 1;
  string error = 2;
}
