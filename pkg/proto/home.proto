syntax = "proto3";
package nyum;

// Home-related message types
message Room {
  string id = 1;
  string name = 2;
  string description = 3;
  int32 floor = 4;
}

message Appliance {
  string id = 1;
  string name = 2;
  string type = 3;
  Room location = 4;
  string model = 5;
  string manufacturer = 6;
  string serial_number = 7;
  string part_number = 8;
}

message Code {
  string id = 1;
  string name = 2;
  string value = 3;
  string type = 4;  // e.g., "wifi", "alarm", "gate"
  string expires_at = 5;
}

// HomeCreation messages
message HomeCreationRequest {
  string name = 1;
  string street_address_1 = 2;
  string street_address_2 = 3;
  string city = 4;
  string state = 5;
  string zip_code = 6;
  string country = 7;
  string description = 8;
  repeated string tags = 9;
  string image_url = 10;
}

message HomeCreationResponse {
  string home_id = 1;
  string message = 2;
  string error = 3;
}

// GetHome messages
message HomeRequest {
  string home_id = 1;
}

message HomeResponse {
  string home_id = 1;
  string owner_id = 2;
  string name = 3;
  string description = 4;
  string street_address_1 = 5;
  string street_address_2 = 6;
  string city = 7;
  string state = 8;
  string zip_code = 9;
  string country = 10;
  repeated string tags = 11;
  string image_url = 12;
  string created_at = 13;
  string updated_at = 14;
}

// UpdateHome messages
message HomeUpdateRequest {
  optional string name = 1;
  optional string address = 2;
  optional string street_address_1 = 3;
  optional string street_address_2 = 4;
  optional string city = 5;
  optional string state = 6;
  optional string zip_code = 7;
  optional string country = 8;
  optional string description = 9;
  repeated string tags = 10;
  optional string image_url = 11;
}

message HomeUpdateResponse {
  string message = 1;
  string error = 2;
}

// DeleteHome messages
message HomeDeleteRequest {
  string home_id = 1;
}

message HomeDeleteResponse {
  string home_id = 1;
  string message = 2;
  string error = 3;
}