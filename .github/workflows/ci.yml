name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-base-image:
    runs-on: ubuntu-latest
    outputs:
      base-image-tag: ${{ steps.base-image.outputs.tag }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build base image
      id: base-image
      run: |
        BASE_TAG="nyumspace-base:${{ github.sha }}"
        echo "Building base image: $BASE_TAG"
        docker build -f Dockerfile.base -t $BASE_TAG .
        echo "tag=$BASE_TAG" >> $GITHUB_OUTPUT

  test:
    runs-on: ubuntu-latest
    needs: build-base-image

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: adminpwd
          POSTGRES_USER: admin
          POSTGRES_DB: nyum
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://admin:adminpwd@localhost:5432/nyum?sslmode=disable
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: adminpwd
      DB_NAME: nyum

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build application image
      run: |
        # First rebuild the base image for this runner
        docker build -f Dockerfile.base -t nyumspace-base:latest .
        
        # Then build the application image
        docker build -f Dockerfile -t nyumspace:test .

    - name: Wait for PostgreSQL to be ready
      run: |
        until docker run --rm --network host postgres:15 pg_isready -h localhost -p 5432 -U admin; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done

    - name: Run migrations in container
      run: |
        echo "Running Goose migrations..."
        docker run --rm --network host \
          -e DATABASE_URL="$DATABASE_URL" \
          -v ${{ github.workspace }}/migrations:/app/migrations \
          nyumspace:test sh -c "cd migrations && goose postgres \$DATABASE_URL up && goose postgres \$DATABASE_URL status"
        
        echo "Running River migrations..."
        docker run --rm --network host \
          -e DATABASE_URL="$DATABASE_URL" \
          nyumspace:test river migrate-up --line main

    - name: Run unit tests
      run: |
        echo "Running unit tests..."
        docker run --rm --network host \
          -e DATABASE_URL="$DATABASE_URL" \
          -e DB_HOST="$DB_HOST" \
          -e DB_PORT="$DB_PORT" \
          -e DB_USER="$DB_USER" \
          -e DB_PASSWORD="$DB_PASSWORD" \
          -e DB_NAME="$DB_NAME" \
          nyumspace:test go test -tags=unit -v ./...

    - name: Run integration tests
      run: |
        echo "Running integration tests..."
        docker run --rm --network host \
          -e DATABASE_URL="$DATABASE_URL" \
          -e DB_HOST="$DB_HOST" \
          -e DB_PORT="$DB_PORT" \
          -e DB_USER="$DB_USER" \
          -e DB_PASSWORD="$DB_PASSWORD" \
          -e DB_NAME="$DB_NAME" \
          nyumspace:test go test -tags=integration -v ./...

    - name: Generate test coverage report
      run: |
        echo "Generating coverage report for unit tests..."
        docker run --rm --network host \
          -e DATABASE_URL="$DATABASE_URL" \
          -e DB_HOST="$DB_HOST" \
          -e DB_PORT="$DB_PORT" \
          -e DB_USER="$DB_USER" \
          -e DB_PASSWORD="$DB_PASSWORD" \
          -e DB_NAME="$DB_NAME" \
          -v ${{ github.workspace }}:/workspace \
          nyumspace:test sh -c "go test -tags=unit -coverprofile=/workspace/unit-coverage.out ./..."
        
        echo "Generating coverage report for integration tests..."
        docker run --rm --network host \
          -e DATABASE_URL="$DATABASE_URL" \
          -e DB_HOST="$DB_HOST" \
          -e DB_PORT="$DB_PORT" \
          -e DB_USER="$DB_USER" \
          -e DB_PASSWORD="$DB_PASSWORD" \
          -e DB_NAME="$DB_NAME" \
          -v ${{ github.workspace }}:/workspace \
          nyumspace:test sh -c "go test -tags=integration -coverprofile=/workspace/integration-coverage.out ./..."

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: |
          unit-coverage.out
          integration-coverage.out

    - name: Check for race conditions
      run: |
        echo "Running race condition detection on unit tests..."
        docker run --rm --network host \
          -e DATABASE_URL="$DATABASE_URL" \
          -e DB_HOST="$DB_HOST" \
          -e DB_PORT="$DB_PORT" \
          -e DB_USER="$DB_USER" \
          -e DB_PASSWORD="$DB_PASSWORD" \
          -e DB_NAME="$DB_NAME" \
          nyumspace:test go test -tags=unit -race ./...
        
        echo "Running race condition detection on integration tests..."
        docker run --rm --network host \
          -e DATABASE_URL="$DATABASE_URL" \
          -e DB_HOST="$DB_HOST" \
          -e DB_PORT="$DB_PORT" \
          -e DB_USER="$DB_USER" \
          -e DB_PASSWORD="$DB_PASSWORD" \
          -e DB_NAME="$DB_NAME" \
          nyumspace:test go test -tags=integration -race ./...

  lint:
    runs-on: ubuntu-latest
    needs: build-base-image
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build application image for linting
      run: |
        # Rebuild base image for this runner
        docker build -f Dockerfile.base -t nyumspace-base:latest .
        
        # Build application image
        docker build -f Dockerfile -t nyumspace:lint .

    - name: Run golangci-lint in container
      run: |
        docker run --rm \
          nyumspace:lint sh -c "go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest && golangci-lint run --timeout=10m"

  security:
    runs-on: ubuntu-latest
    needs: build-base-image
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build application image for security scan
      run: |
        # Rebuild base image for this runner
        docker build -f Dockerfile.base -t nyumspace-base:latest .
        
        # Build application image
        docker build -f Dockerfile -t nyumspace:security .

    - name: Run Gosec Security Scanner in container
      run: |
        docker run --rm \
          nyumspace:security sh -c "go install github.com/securecorp/gosec/v2/cmd/gosec@latest && gosec ./..."
