name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.2
        args: --timeout=5m

  security:
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Run GoSec
      uses: securego/gosec@master
      with:
        args: |
          -exclude=G103,G112
          -exclude-generated
          ./...


  tests:
    runs-on: ubuntu-latest
    needs: [lint, security]
    environment: testing

    services:
      postgres:
        # Docker Hub image
        image: postgres
        env:
          POSTGRES_PASSWORD: ${{ secrets.PGPASSWORD }}
          POSTGRES_USER: ${{ secrets.PGUSER }}
          POSTGRES_DB: ${{ vars.PGDATABASE }}
          POSTGRES_HOST: ${{ vars.PGHOST }}
          POSTGRES_PORT: ${{ vars.PGPORT }}
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432
      localstack-s3:
        image: localstack/localstack:s3-latest
        ports:
          - 4566:4566  # LocalStack Gateway
        options: >-
          --health-cmd "curl --silent --fail http://localhost:4566/_localstack/health | grep '\"s3\": \"running\"'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 7

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: go mod download

    - name: Install goose
      run: go install github.com/pressly/goose/v3/cmd/goose@latest

    - name: Install riverqueue CLI
      run: go install github.com/riverqueue/river/cmd/river@latest

    - name: Run goose migrations
      env:
        GOOSE_DRIVER: postgres
        GOOSE_DBSTRING: postgres://${{secrets.PGUSER}}:${{secrets.PGPASSWORD}}@${{vars.PGHOST}}:${{vars.PGPORT}}/${{vars.PGDATABASE}}?sslmode=disable
        GOOSE_MIGRATION_DIR: ./migrations
      run: |
        goose up

    - name: Setup riverqueue migrations
      env:
        RIVER_DB_URL: postgres://${{ secrets.PGUSER }}:${{ secrets.PGPASSWORD }}@${{ vars.PGHOST }}:${{ vars.PGPORT }}/${{ vars.PGDATABASE }}?sslmode=disable
      run: |
        river migrate-up --line main --database-url $RIVER_DB_URL

    - name: Run unit tests
      env:
        PGUSER: ${{ secrets.PGUSER }}
        PGPASSWORD: ${{ secrets.PGPASSWORD }}
        PGDATABASE: ${{ vars.PGDATABASE }}
        PGHOST: localhost
        PGPORT: 5432
      run: go test -v -tags=unit ./...

    - name: Run integration tests
      env:
          NYUMSPACE_ENV: ${{ vars.NYUMSPACE_ENV }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGDATABASE: ${{ vars.PGDATABASE }}
          PGHOST: localhost
          PGPORT: 5432
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ vars.S3_REGION }}
      run: go test -v -tags=integration ./...

    - name: Build application
      run: go build -v ./cmd/serves
