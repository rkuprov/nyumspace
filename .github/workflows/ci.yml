name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-base-image:
    runs-on: ubuntu-latest
    outputs:
      base-image-tag: ${{ steps.base-image.outputs.tag }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and cache base image
      id: base-image
      run: |
        BASE_TAG="nyumspace-base:${{ github.sha }}"
        echo "Building base image: $BASE_TAG"
        docker build -f Dockerfile.base -t $BASE_TAG .
        # Save the image as a tar file for sharing between jobs
        docker save $BASE_TAG | gzip > /tmp/base-image.tar.gz
        echo "tag=$BASE_TAG" >> $GITHUB_OUTPUT

    - name: Upload base image artifact
      uses: actions/upload-artifact@v4
      with:
        name: base-image
        path: /tmp/base-image.tar.gz
        retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: build-base-image

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ secrets.PGPASSWORD }}
          POSTGRES_USER: ${{ secrets.PGUSER }}
          POSTGRES_DB: ${{ vars.PGDATABASE }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://${{ secrets.PGUSER }}:${{ secrets.PGPASSWORD }}@${{ vars.PGHOST }}:${{ vars.PGPORT }}/${{ vars.PGDATABASE }}?sslmode=disable
      GOOSE_DRIVER: ${{ vars.GOOSE_DRIVER }}
      GOOSE_DBSTRING: postgres://${{ secrets.PGUSER }}:${{ secrets.PGPASSWORD }}@${{ vars.PGHOST }}:${{ vars.PGPORT }}/${{ vars.PGDATABASE }}?sslmode=disable
      GOOSE_MIGRATION_DIR: app/migrations
      PGHOST: ${{ vars.PGHOST }}
      PGPORT: ${{ vars.PGPORT }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGDATABASE: ${{ vars.PGDATABASE }}
      HTTP_HOST: ${{ vars.HTTP_HOST }}
      HTTP_PORT: ${{ vars.HTTP_PORT }}

    steps:
    - uses: actions/checkout@v4

    - name: Download base image artifact
      uses: actions/download-artifact@v4
      with:
        name: base-image
        path: /tmp

    - name: Load base image
      run: |
        docker load < /tmp/base-image.tar.gz

    - name: Build application image
      run: |
        # Build the application image using the cached base image
        docker build -f Dockerfile -t nyumspace:test .

    - name: Wait for PostgreSQL to be ready
      run: |
        until docker run --rm --network host postgres:15 pg_isready -h ${{ vars.PGHOST }} -p ${{ vars.PGPORT }} -U ${{ secrets.PGUSER }}; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done

    - name: Run migrations in container
      run: |
        echo "Running Goose migrations..."
        docker run --rm --network host \
          -e DATABASE_URL="$DATABASE_URL" \
          -e GOOSE_DRIVER="$GOOSE_DRIVER" \
          -e GOOSE_DBSTRING="$GOOSE_DBSTRING" \
          -v ${{ github.workspace }}/migrations:/app/migrations \
          nyumspace:test sh -c "cd migrations && goose up && goose status"
        
        echo "Running River migrations..."
        docker run --rm --network host \
          -e DATABASE_URL="$DATABASE_URL" \
          nyumspace:test river migrate-up --line main --database-url "$DATABASE_URL"

    - name: Run unit tests
      run: |
        echo "Running unit tests..."
        docker run --rm --network host \
          -e DATABASE_URL="$DATABASE_URL" \
          -e PGHOST="${{ vars.PGHOST }}" \
          -e PGPORT="${{ vars.PGPORT }}" \
          -e PGUSER="${{ secrets.PGUSER }}" \
          -e PGPASSWORD="${{ secrets.PGPASSWORD }}" \
          -e PGDATABASE="${{ vars.PGDATABASE }}" \
          -e HTTP_HOST="${{ vars.HTTP_HOST }}" \
          -e HTTP_PORT="${{ vars.HTTP_PORT }}" \
          nyumspace:test go test -tags=unit -v ./...

    - name: Run integration tests
      run: |
        echo "Running integration tests..."
        docker run --rm --network host \
          -e DATABASE_URL="$DATABASE_URL" \
          -e PGHOST="${{ vars.PGHOST }}" \
          -e PGPORT="${{ vars.PGPORT }}" \
          -e PGUSER="${{ secrets.PGUSER }}" \
          -e PGPASSWORD="${{ secrets.PGPASSWORD }}" \
          -e PGDATABASE="${{ vars.PGDATABASE }}" \
          -e HTTP_HOST="${{ vars.HTTP_HOST }}" \
          -e HTTP_PORT="${{ vars.HTTP_PORT }}" \
          nyumspace:test go test -tags=integration -v ./...

    - name: Generate test coverage report
      run: |
        echo "Generating coverage report for unit tests..."
        docker run --rm --network host \
          -e DATABASE_URL="$DATABASE_URL" \
          -e PGHOST="${{ vars.PGHOST }}" \
          -e PGPORT="${{ vars.PGPORT }}" \
          -e PGUSER="${{ secrets.PGUSER }}" \
          -e PGPASSWORD="${{ secrets.PGPASSWORD }}" \
          -e PGDATABASE="${{ vars.PGDATABASE }}" \
          -e HTTP_HOST="${{ vars.HTTP_HOST }}" \
          -e HTTP_PORT="${{ vars.HTTP_PORT }}" \
          -v ${{ github.workspace }}:/workspace \
          nyumspace:test sh -c "go test -tags=unit -coverprofile=/workspace/unit-coverage.out ./..."
        
        echo "Generating coverage report for integration tests..."
        docker run --rm --network host \
          -e DATABASE_URL="$DATABASE_URL" \
          -e PGHOST="${{ vars.PGHOST }}" \
          -e PGPORT="${{ vars.PGPORT }}" \
          -e PGUSER="${{ secrets.PGUSER }}" \
          -e PGPASSWORD="${{ secrets.PGPASSWORD }}" \
          -e PGDATABASE="${{ vars.PGDATABASE }}" \
          -e HTTP_HOST="${{ vars.HTTP_HOST }}" \
          -e HTTP_PORT="${{ vars.HTTP_PORT }}" \
          -v ${{ github.workspace }}:/workspace \
          nyumspace:test sh -c "go test -tags=integration -coverprofile=/workspace/integration-coverage.out ./..."

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: |
          unit-coverage.out
          integration-coverage.out

    - name: Check for race conditions
      run: |
        echo "Running race condition detection on unit tests..."
        docker run --rm --network host \
          -e DATABASE_URL="$DATABASE_URL" \
          -e PGHOST="${{ vars.PGHOST }}" \
          -e PGPORT="${{ vars.PGPORT }}" \
          -e PGUSER="${{ secrets.PGUSER }}" \
          -e PGPASSWORD="${{ secrets.PGPASSWORD }}" \
          -e PGDATABASE="${{ vars.PGDATABASE }}" \
          -e HTTP_HOST="${{ vars.HTTP_HOST }}" \
          -e HTTP_PORT="${{ vars.HTTP_PORT }}" \
          nyumspace:test go test -tags=unit -race ./...
        
        echo "Running race condition detection on integration tests..."
        docker run --rm --network host \
          -e DATABASE_URL="$DATABASE_URL" \
          -e PGHOST="${{ vars.PGHOST }}" \
          -e PGPORT="${{ vars.PGPORT }}" \
          -e PGUSER="${{ secrets.PGUSER }}" \
          -e PGPASSWORD="${{ secrets.PGPASSWORD }}" \
          -e PGDATABASE="${{ vars.PGDATABASE }}" \
          -e HTTP_HOST="${{ vars.HTTP_HOST }}" \
          -e HTTP_PORT="${{ vars.HTTP_PORT }}" \
          nyumspace:test go test -tags=integration -race ./...

  lint:
    runs-on: ubuntu-latest
    needs: build-base-image
    steps:
    - uses: actions/checkout@v4

    - name: Download base image artifact
      uses: actions/download-artifact@v4
      with:
        name: base-image
        path: /tmp

    - name: Load base image
      run: |
        docker load < /tmp/base-image.tar.gz

    - name: Build application image for linting
      run: |
        docker build -f Dockerfile -t nyumspace:lint .

    - name: Run golangci-lint in container
      run: |
        docker run --rm \
          nyumspace:lint sh -c "go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest && golangci-lint run --timeout=10m"

  security:
    runs-on: ubuntu-latest
    needs: build-base-image
    steps:
    - uses: actions/checkout@v4

    - name: Download base image artifact
      uses: actions/download-artifact@v4
      with:
        name: base-image
        path: /tmp

    - name: Load base image
      run: |
        docker load < /tmp/base-image.tar.gz

    - name: Build application image for security scan
      run: |
        docker build -f Dockerfile -t nyumspace:security .

    - name: Run Gosec Security Scanner in container
      run: |
        docker run --rm \
          nyumspace:security sh -c "go install github.com/securecorp/gosec/v2/cmd/gosec@latest && gosec ./..."
